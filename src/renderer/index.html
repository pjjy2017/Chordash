<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chordash</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
  </head>

  <body>
    <div id="app" data-view="editor">
      <header class="toolbar">
        <div class="file-buttons">
          <button data-command="new" title="새 파일 (Ctrl+N)">새 파일</button>
          <button data-command="open" title="열기 (Ctrl+O)">열기</button>
          <button data-command="save" title="저장 (Ctrl+S)">저장</button>
          <button data-command="saveAs" title="다른 이름으로 저장 (Ctrl+Shift+S)">
            다른 이름으로 저장
          </button>
          <button data-command="exportPdf" title="PDF로 내보내기 (Ctrl+P)">PDF</button>
        </div>
        <span class="spacer"></span>
        <span id="status" class="status"></span>
        <label class="toggle"><input id="hints" type="checkbox" checked /> 힌트</label>
        <button
          id="toggle-preview"
          class="preview-toggle"
          aria-pressed="true"
          title="인쇄 미리보기 보이기/숨기기"
        >
          미리보기
        </button>
      </header>
      <!-- Shown only on narrow screens, where one pane is visible at a time. -->
      <nav class="view-tabs" role="tablist">
        <button data-view="editor" role="tab" aria-selected="true">입력</button>
        <button data-view="preview" role="tab" aria-selected="false">미리보기</button>
      </nav>
      <main class="split">
        <section class="editor-pane">
          <!-- Header fields mirror the title:/key:/theme: lines at the top of the file. -->
          <div class="header-fields">
            <label class="field field-title">
              제목
              <input id="field-title" type="text" placeholder="곡 제목" spellcheck="false" />
            </label>
            <label class="field field-key">
              키
              <input
                id="field-key"
                type="text"
                placeholder="예: F, c-, Bb, F#m"
                spellcheck="false"
                autocomplete="off"
              />
              <!-- How the typed key was read, e.g. "C 단조"; red when it can't be read. -->
              <span id="field-key-reading" class="field-reading"></span>
            </label>
          </div>
          <div id="editor" class="editor-host"></div>
        </section>
        <section id="preview" class="preview-pane"></section>
      </main>
    </div>
    <script type="module" src="./src/renderer.ts"></script>
  </body>
</html>
