<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chordash</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
  </head>

  <body>
    <div id="app" data-view="editor">
      <header class="toolbar">
        <div class="file-buttons">
          <button data-command="new" title="새 파일 (Ctrl+N)">새 파일</button>
          <button data-command="open" title="열기 (Ctrl+O)">열기</button>
          <button data-command="save" title="저장 (Ctrl+S)">저장</button>
          <button data-command="saveAs" title="다른 이름으로 저장 (Ctrl+Shift+S)">
            다른 이름으로 저장
          </button>
          <button data-command="exportPdf" title="PDF로 내보내기 (Ctrl+P)">PDF</button>
          <button data-command="import" title="다른 형식의 악보 텍스트를 가져오기">가져오기</button>
        </div>
        <span class="spacer"></span>
        <span id="status" class="status"></span>
        <label class="toggle"><input id="hints" type="checkbox" checked /> 힌트</label>
        <button
          id="toggle-preview"
          class="preview-toggle"
          aria-pressed="true"
          title="인쇄 미리보기 보이기/숨기기"
        >
          미리보기
        </button>
      </header>
      <!-- Shown only on narrow screens, where one pane is visible at a time. -->
      <nav class="view-tabs" role="tablist">
        <button data-view="editor" role="tab" aria-selected="true">입력</button>
        <button data-view="preview" role="tab" aria-selected="false">미리보기</button>
      </nav>
      <main class="split">
        <section class="editor-pane">
          <!-- Header fields mirror the title:/key:/theme: lines at the top of the file. -->
          <div class="header-fields">
            <label class="field field-title">
              제목
              <input id="field-title" type="text" placeholder="곡 제목" spellcheck="false" />
            </label>
            <label class="field field-key">
              키
              <input
                id="field-key"
                type="text"
                placeholder="예: F, c-, Bb, F#m"
                spellcheck="false"
                autocomplete="off"
              />
              <!-- How the typed key was read, e.g. "C 단조"; red when it can't be read. -->
              <span id="field-key-reading" class="field-reading"></span>
            </label>
            <!-- Transposition shows the sheet in another key; the text changes only on "원본에 적용". -->
            <div class="field field-transpose">
              <label for="transpose-key">조옮김</label>
              <input
                id="transpose-key"
                type="text"
                placeholder="예: G, e-"
                spellcheck="false"
                autocomplete="off"
              />
              <button type="button" id="transpose-down" class="step" title="반음 내리기">▼</button>
              <button type="button" id="transpose-up" class="step" title="반음 올리기">▲</button>
              <span id="transpose-reading" class="field-reading"></span>
              <button type="button" id="transpose-apply" class="action" hidden>원본에 적용</button>
              <button type="button" id="transpose-cancel" class="action" hidden>취소</button>
            </div>
          </div>
          <div id="editor" class="editor-host"></div>
        </section>
        <section id="preview" class="preview-pane">
          <!-- After an import: switch between the sheet and the original text to review. -->
          <div id="preview-switch" class="preview-switch" hidden>
            <button type="button" data-show="pages" aria-pressed="true">미리보기</button>
            <button type="button" data-show="original" aria-pressed="false">원본</button>
            <span id="original-info" class="original-info"></span>
          </div>
          <div id="pages-host"></div>
          <pre id="original" class="original" hidden></pre>
        </section>
      </main>
    </div>
    <dialog id="import-dialog" class="import-dialog">
      <form method="dialog">
        <h2>악보 가져오기</h2>
        <p>
          웹에서 복사한 코드 악보(가사 위에 코드), 마디선 텍스트(| C | Am |), ChordPro를 Chordash
          문법으로 바꿔요. 확실하지 않은 곳에는 <b>?</b> 표시가 붙어요.
        </p>
        <textarea
          id="import-text"
          rows="14"
          spellcheck="false"
          placeholder="여기에 붙여넣기 (Ctrl+V)"
        ></textarea>
        <div class="import-actions">
          <button type="button" id="import-from-file">파일에서 가져오기…</button>
          <span class="spacer"></span>
          <button value="cancel">취소</button>
          <button type="button" id="import-paste" class="primary">붙여넣은 글 바꾸기</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="./src/renderer.ts"></script>
  </body>
</html>
