appId: com.chordash.app
productName: Chordash
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!docs/*'
  - '!examples/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,CLAUDE.md,README.md}'
  - '!{.env,.env.*,.npmrc}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # The Android app and the website are built from the same folder; the desktop app needs
  # neither (1.6.1: the installer used to carry the whole android/ build, 49 MB).
  - '!{android,ios,dist-web,scripts}/**'
  - '!{capacitor.config.ts,vite.web.config.ts,vite.pdfjs.ts,*.zip}'
  # Developer files inside the libraries the app runs with: source maps, type definitions, notes.
  - '!**/node_modules/**/*.{map,d.ts,d.mts,d.cts,md,markdown}'
  - '!**/node_modules/**/{test,tests,__tests__,docs,example,examples}/**'
# Chromium's interface translations: Korean and English only (1.6.1, about 43 MB less).
electronLanguages:
  - ko
  - en-US
asarUnpack:
  - resources/**
win:
  executableName: Chordash
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
npmRebuild: false
# In-app updates (1.5): the app reads latest.yml from GitHub Releases. Upload latest.yml and the
# .blockmap with the installer on every release.
publish:
  provider: github
  owner: pjjy2017
  repo: Chordash
